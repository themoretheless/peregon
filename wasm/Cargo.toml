[package]
name = "peregon_engine"
version = "1.0.0"
edition = "2021"
description = "Rust/WASM engine for Peregon"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
themoretheless-tokenizer = { git = "https://github.com/themoretheless/tokenizer.git", tag = "v0.1.0" }
wasm-bindgen = "=0.2.125"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
